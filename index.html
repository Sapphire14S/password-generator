<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Password Generator</title>
  <meta name="description" content="A secure and customizable password generator built with HTML, CSS, and JavaScript.">

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <!-- FLOATING TEXTS -->

  <div class="floating-text text1">SECURE PASSWORD</div>
  <div class="floating-text text2">CYBER SECURITY</div>
  <div class="floating-text text3">ENCRYPTION</div>
  <div class="floating-text text4">SAFE PASSWORD</div>
  <div class="floating-text text5">PRIVACY</div>
  <div class="floating-text text6">PROTECTION</div>


  <!-- MAIN CARD -->

  <div class="container">

    <h1>Password Generator</h1>

    <!-- Password Box -->
    <div class="password-box">
      <input type="text" id="password"/>
      <button id="copy-btn">Copy</button>
    </div>

    <!-- Length -->
    <div class="setting">
      <label>
        Password Length:
        <span id="length-value">12</span>
      </label>

      <input type="range" id="length" min="4" max="20" value="12" />
    </div>

    <!-- Options -->
    <div class="options">

      <label>
        <input type="checkbox" id="numbers" checked />
        Include Numbers
      </label>

      <label>
        <input type="checkbox" id="symbols" checked />
        Include Symbols
      </label>

    </div>

    <!-- Strength -->
    <div class="strength">
      Strength:
      <span id="strength-text">Medium</span>
    </div>

    <!-- Generate Button -->
    <button id="generate-btn">
      Generate Password
    </button>

  </div>

  <script src="script.js"></script>

</body>

</html>
